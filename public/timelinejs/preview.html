.tl-message,
.tl-message-full {
  width: 100%;
  height: 100%;
  position: absolute;
  display: table;
  overflow: hidden;
  top: 0px;
  left: 0px;
  z-index: 99;

.tl-message .tl-message-container,
.tl-message-full .tl-message-container {
  padding: 20px;
  margin: 20px;
  text-align: center;
  vertical-align: middle;
  display: table-cell;
}
.tl-message .tl-message-container .tl-message-content,
.tl-message-full .tl-message-container .tl-message-content {
  color: #666;
  text-align: center;
  font-size: 11px;
  line-height: 13px;
  text-transform: uppercase;
  margin-top: 7.5px;
  margin-bottom: 7.5px;
  text-shadow: 1px 1px 1px #FFF;
}
.tl-message .tl-message-container .tl-message-content strong,
.tl-message-full .tl-message-container .tl-message-content strong {
  text-transform: uppercase;
}
.tl-message .tl-message-container .tl-loading-icon,
.tl-message-full .tl-message-container .tl-loading-icon {
  width: 30px;
  height: 30px;
  background-color: #666;
  vertical-align: middle;
  -webkit-box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.1);
  -moz-box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.1);
  box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.1);
  margin-left: auto;
  margin-right: auto;
  text-align: center;
  -webkit-animation: rotateplane 1.2s infinite ease-in-out;
  animation: rotateplane 1.2s infinite ease-in-out;
}
@-webkit-keyframes rotateplane {
  0% {
    -webkit-transform: perspective(120px);
  }
  50% {
    -webkit-transform: perspective(120px) rotateY(180deg);
  }
  100% {
    -webkit-transform: perspective(120px) rotateY(180deg) rotateX(180deg);
  }
}
@keyframes rotateplane {
  0% {
    transform: perspective(120px) rotateX(0deg) rotateY(0deg);
  }
  50% {
    transform: perspective(120px) rotateX(-180.1deg) rotateY(0deg);
  }
  100% {
    transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg);
  }
}

/* TL.TimeNav
================================================== */
.tl-timenav {
  width: 100%;
  background-color: #f2f2f2;
  position: relative;
  overflow: hidden;
  border-top: 1px solid #e5e5e5;
  direction: ltr;
}
.tl-timenav .tl-timenav-line {
  position: absolute;
  top: 0;
  left: 50%;
  width: 1px;
  height: 100%;
  background-color: #d9d9d9;
  z-index: 2;
  display: none;
}
.tl-timenav .tl-timenav-line:before,
.tl-timenav .tl-timenav-line:after {
  font-family: 'tl-icons';
  speak: none;
  font-style: normal;
  font-weight: normal;
  font-variant: normal;
  text-transform: none;
  line-height: 1;
  /* Better Font Rendering =========== */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  color: #c34528;
  font-size: 32px;
  line-height: 32px;
  position: absolute;
  left: -14px;
}
.tl-timenav .tl-timenav-line:before {
  top: -10px;
}
.tl-timenav .tl-timenav-line:after {
  content: "\ea41";
  bottom: 24px;
}
.tl-timenav .tl-timenav-slider {
  position: absolute;
  height: 100%;
  width: 100%;
  top: 0;
}

<style>:root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #172033; }
:root[data-theme="dark"] { color-scheme: dark; background: #111827; color: #e5e7eb; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
#timeline { width: 100%; height: 100%; }
#preview-status { position: absolute; inset: 1rem 1rem auto; z-index: 20; margin: 0; padding: 1rem; background: #f1f5f9; color: #172033; border: 1px solid #cbd5e1; border-radius: .5rem; line-height: 1.5; }
#preview-status[hidden] { display: none; }
.tl-timeline, .tl-timeline h1, .tl-timeline h2, .tl-timeline h3, .tl-timeline h4, .tl-timeline p, .tl-timeline .tl-headline, .tl-timeline .tl-timeaxis-tick-text, .tl-timeline .tl-timemarker-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.tl-timeline .tl-text-content { overflow-wrap: anywhere; }
.tl-timeline .tl-headline { overflow-wrap: anywhere; }
.tl-timeline .tl-slide-content-container { overflow-y: auto; }
.tl-timeline.tl-skinny .tl-headline { font-size: 1.35rem; line-height: 1.25; }
.tl-timeline :focus-visible { outline: 3px solid #6366f1; outline-offset: 3px; }
:root[data-theme="dark"] #preview-status { background: #1f2937; color: #e5e7eb; border-color: #475569; }
:root[data-theme="dark"] .tl-timeline,
:root[data-theme="dark"] .tl-storyslider,
:root[data-theme="dark"] .tl-slide,
:root[data-theme="dark"] .tl-slide-background { background: #111827; }
:root[data-theme="dark"] .tl-timeline .tl-headline,
:root[data-theme="dark"] .tl-timeline .tl-text-content,
:root[data-theme="dark"] .tl-timeline .tl-text-content p,
:root[data-theme="dark"] .tl-timeline .tl-slidenav-title,
:root[data-theme="dark"] .tl-timeline .tl-slidenav-description { color: #e5e7eb; }
:root[data-theme="dark"] .tl-timenav { background: #1f2937; border-color: #475569; }
:root[data-theme="dark"] .tl-timeaxis { background: #1f2937; }
:root[data-theme="dark"] .tl-timeaxis-tick-text,
:root[data-theme="dark"] .tl-timegroup-message { color: #cbd5e1; }
:root[data-theme="dark"] .tl-timemarker-content-container { background: #334155; color: #e5e7eb; }
:root[data-theme="dark"] .tl-timemarker .tl-headline { color: #e5e7eb; }
:root[data-theme="dark"] .tl-timemarker-active .tl-timemarker-content-container { background: #4338ca; }
:root[data-theme="dark"] .tl-timeline a { color: #a5b4fc; }
@media (max-width: 600px) { #preview-status { inset: .5rem .5rem auto; padding: .75rem; } }
@media (prefers-reduced-motion: reduce) { .tl-timeline *, .tl-timeline *::before, .tl-timeline *::after { animation-duration: 0s !important; transition-duration: 0s !important; } }
/* Keep navigation legible without the upstream low-opacity hover treatment. */
.tl-timeline .tl-timegroup-message { color: #475569; text-shadow: none; font-weight: 500; }
.tl-timeline .tl-timeaxis-tick-text { color: #475569; text-shadow: none; }
.tl-timeline .tl-slidenav-title { opacity: 1; }
.tl-timeline .tl-slidenav-content-container .tl-slidenav-icon,
.tl-timeline .tl-slidenav-content-container .tl-slidenav-title,
.tl-timeline .tl-slidenav-content-container .tl-slidenav-description { text-shadow: none; }
.tl-timeline .tl-menubar-button { color: #475569; background: #f1f5f9; }
.tl-timeline .tl-menubar-button:hover,
.tl-timeline .tl-menubar-button:focus-visible { color: #fff; background: #4338ca; }
:root[data-theme="dark"] .tl-timeline .tl-timegroup { background: #243247; }
:root[data-theme="dark"] .tl-timeline .tl-timegroup-alternate { background: #29394f; }
:root[data-theme="dark"] .tl-timeline .tl-timegroup-message,
:root[data-theme="dark"] .tl-timeline .tl-timeaxis-tick-text { color: #cbd5e1; text-shadow: none; }
:root[data-theme="dark"] .tl-timeline .tl-slidenav-content-container .tl-slidenav-icon,
:root[data-theme="dark"] .tl-timeline .tl-slidenav-content-container .tl-slidenav-title,
:root[data-theme="dark"] .tl-timeline .tl-slidenav-content-container .tl-slidenav-description { color: #e5e7eb; text-shadow: none; }
:root[data-theme="dark"] .tl-timeline .tl-menubar-button { color: #e5e7eb; background: #334155; }
:root[data-theme="dark"] .tl-timeline .tl-menubar-button:hover,
:root[data-theme="dark"] .tl-timeline .tl-menubar-button:focus-visible { color: #fff; background: #4338ca; }
body { display: flex; flex-direction: column; }
#timeline { flex: 1; min-height: 0; height: auto; }
#presentation-controls { display: flex; flex: none; align-items: center; justify-content: space-between; gap: .5rem; min-height: 40px; padding: .3rem .5rem; border-top: 1px solid #cbd5e1; background: #f1f5f9; font-size: .75rem; }
#presentation-controls[hidden] { display: none; }
#presentation-controls button { border: 1px solid #64748b; border-radius: .3rem; padding: .35rem .55rem; background: #fff; color: #172033; font: inherit; cursor: pointer; }
#presentation-controls button:disabled { opacity: .5; cursor: default; }
#presentation-controls button:focus-visible { outline: 3px solid #6366f1; outline-offset: 1px; }
:root[data-theme="dark"] #presentation-controls { background: #1f2937; color: #e5e7eb; border-color: #475569; }
:root[data-theme="dark"] #presentation-controls button { background: #334155; color: #e5e7eb; border-color: #94a3b8; }
/* Native controls provide the navigation alternative without a blocking swipe hint. */
.tl-storyslider > .tl-message-full { display: none; }
/* Reserve a separate toolbar row between the axis and native slide controls.
   Upstream positions this toolbar above the axis using an inline top value. */
#timeline { margin-bottom: 42px; overflow: visible; }
#timeline .tl-menubar {
  top: auto !important;
  bottom: -42px !important;
  left: 0;
  width: 100%;
  height: 42px;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 1px 4px;
  border-top: 1px solid #cbd5e1;
  border-radius: 0;
  background: #f1f5f9;
}
#timeline .tl-menubar-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 44px;
  min-width: 44px;
  height: 40px;
  padding: 4px;
}
:root[data-theme="dark"] #timeline .tl-menubar { background: #1f2937; border-color: #475569; }
:root[data-theme="dark"] #timeline .tl-timeaxis-background { background: #1f2937; border-top-color: #475569; }
:root[data-theme="dark"] #timeline .tl-timeaxis .tl-timeaxis-tick-text { color: #e2e8f0; }
:root[data-theme="dark"] #timeline .tl-timeaxis .tl-timeaxis-tick::before { border-left-color: #94a3b8; color: #94a3b8; }

/* Override the upstream nested marker headline rules in dark mode. */
:root[data-theme="dark"] #timeline .tl-timemarker .tl-headline,
:root[data-theme="dark"] #timeline .tl-timemarker .tl-headline p { color: #f8fafc; }
</style>
</head>
