name = "researchtoolspy-containers"
main = "src/index.ts"
compatibility_date = "2025-09-30"
compatibility_flags = ["nodejs_compat"]

# ==========================================
# Cloudflare Containers Configuration
# ==========================================

# SearXNG metasearch engine container (needs more memory)
[[containers]]
class_name = "SearXNGContainer"
image = "./searxng/Dockerfile"
max_instances = 3
instance_type = "standard-1"

# OSINT Agent container for intelligent search collection
[[containers]]
class_name = "OSINTAgentContainer"
image = "./osint-agent/Dockerfile"
max_instances = 5

# Durable Objects bindings for containers
[[durable_objects.bindings]]
name = "SEARXNG"
class_name = "SearXNGContainer"

[[durable_objects.bindings]]
name = "OSINT_AGENT"
class_name = "OSINTAgentContainer"

# Container migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SearXNGContainer", "OSINTAgentContainer"]

# Environment Variables
[vars]
ENVIRONMENT = "production"
# OSINT agent's OpenAI calls go through this Cloudflare AI Gateway. Not a secret.
# AI_GATEWAY_TOKEN (optional, "AI Gateway Run") is a secret: wrangler secret put AI_GATEWAY_TOKEN
AI_GATEWAY_ACCOUNT_ID = "04eac09ae835290383903273f68c79b0"
AI_GATEWAY_ID = "research-tools-ai"

# Secrets should be set via: wrangler secret put <NAME>
# Required secrets:
# - OPENAI_API_KEY
